<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>студия 505 · шрифт для «505»</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Unbounded:wght@800&family=Krona+One&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--blue:#002FA7;--paper:#FFFAF0;--ink:#000}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Jost,system-ui,sans-serif;padding:32px 16px 64px}
.wrap{max-width:1300px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin-bottom:24px}
.grid{display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.ref{grid-row:span 2;border-radius:12px;overflow:hidden;background:#000;display:flex;flex-direction:column}
.ref img{width:100%;height:100%;object-fit:cover}
.ref p{color:#fff;font-size:14px;padding:8px 12px}
.cell{border-radius:12px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 12px}
.sky{background:#B9CDEE}
.night{background:#000;color:#fff}
.n{font-size:clamp(48px,7vw,104px);line-height:.9;color:var(--blue)}
.night .n{color:#0047D6}
.name{font-size:14px}
.unb{font-family:Unbounded;font-weight:800;letter-spacing:-.02em}
.kro{font-family:"Krona One";letter-spacing:-.02em}
.syn{font-family:Syncopate;font-weight:700;letter-spacing:-.04em}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}.ref{grid-column:1 / -1;grid-row:auto;max-height:320px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>«505»: три широких шрифта рядом с постом студии</h1>
  <div class="grid">
    <figure class="ref"><img src="ref-505.jpg" alt="Пост студии: синее «505» на чёрном"><p>как в посте</p></figure>
    <div class="cell sky"><p class="n unb">505</p><p class="name">1 · Unbounded</p></div>
    <div class="cell sky"><p class="n kro">505</p><p class="name">2 · Krona One</p></div>
    <div class="cell sky"><p class="n syn">505</p><p class="name">3 · Syncopate Bold</p></div>
    <div class="cell night"><p class="n unb">505</p><p class="name">1 · Unbounded</p></div>
    <div class="cell night"><p class="n kro">505</p><p class="name">2 · Krona One</p></div>
    <div class="cell night"><p class="n syn">505</p><p class="name">3 · Syncopate Bold</p></div>
  </div>
</div>
</body>
</html>
